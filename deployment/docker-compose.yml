services:
  backend:
    build:
      context: ../backend
    container_name: aegisops-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aegisops
      PROMETHEUS_URL: http://prometheus:9090
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      INFEROPS_AI_URL: ${INFEROPS_AI_URL:-}
      INFEROPS_API_KEY: ${INFEROPS_API_KEY:-}
      DEMO_SERVICE_URLS: payment-service=http://payment-service:8100,checkout-service=http://checkout-service:8100,auth-service=http://auth-service:8100,recommendation-service=http://recommendation-service:8100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      payment-service:
        condition: service_started
      checkout-service:
        condition: service_started
      auth-service:
        condition: service_started
      recommendation-service:
        condition: service_started

  frontend:
    build:
      context: ../frontend
    container_name: aegisops-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    depends_on:
      - backend

  payment-service:
    build:
      context: ../demo-services
    container_name: aegisops-payment-service
    environment:
      SERVICE_NAME: payment-service
    ports:
      - "8101:8100"

  checkout-service:
    build:
      context: ../demo-services
    container_name: aegisops-checkout-service
    environment:
      SERVICE_NAME: checkout-service
    ports:
      - "8102:8100"

  auth-service:
    build:
      context: ../demo-services
    container_name: aegisops-auth-service
    environment:
      SERVICE_NAME: auth-service
    ports:
      - "8103:8100"

  recommendation-service:
    build:
      context: ../demo-services
    container_name: aegisops-recommendation-service
    environment:
      SERVICE_NAME: recommendation-service
    ports:
      - "8104:8100"

  postgres:
    image: postgres:15
    container_name: aegisops-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aegisops
    ports:
      - "5432:5432"
    volumes:
      - aegisops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aegisops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: aegisops-redis
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: aegisops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
      - payment-service
      - checkout-service
      - auth-service
      - recommendation-service

  grafana:
    image: grafana/grafana:11.2.2
    container_name: aegisops-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  aegisops_postgres_data:
