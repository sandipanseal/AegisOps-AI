apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisops-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aegisops-frontend
  template:
    metadata:
      labels:
        app: aegisops-frontend
    spec:
      containers:
        - name: frontend
          image: aegisops-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_BACKEND_URL
              value: http://aegisops-backend:8000
---
apiVersion: v1
kind: Service
metadata:
  name: aegisops-frontend
spec:
  selector:
    app: aegisops-frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
