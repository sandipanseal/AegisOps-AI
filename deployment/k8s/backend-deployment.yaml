apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisops-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegisops-backend
  template:
    metadata:
      labels:
        app: aegisops-backend
    spec:
      containers:
        - name: backend
          image: aegisops-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@postgres:5432/aegisops
            - name: PROMETHEUS_URL
              value: http://prometheus:9090
---
apiVersion: v1
kind: Service
metadata:
  name: aegisops-backend
spec:
  selector:
    app: aegisops-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
