global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "aegisops-backend"
    static_configs:
      - targets: ["backend:8000"]

  - job_name: "aegisops-demo-services"
    static_configs:
      - targets:
          - "payment-service:8100"
          - "checkout-service:8100"
          - "auth-service:8100"
          - "recommendation-service:8100"
